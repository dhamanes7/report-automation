<svg width="900" height="610" viewBox="0 0 900 610" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Column-level lineage into the Addition and Deletion sheets</title>
<style>
  text{font-family:Arial,Helvetica,sans-serif;}
  .hdr{font-size:12.5px;font-weight:700;}
  .row{font-size:11px;}
  .lbl{font-size:10px;font-style:italic;}
  .teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75;}
  .tealtext{fill:#085041;}
  .amber{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.75;}
  .ambertext{fill:#633806;}
  .gray{fill:#FAFAF8;stroke:#888780;stroke-width:0.75;}
  .rowtext{fill:#2C2C2A;}
</style>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7A8F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a2amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a2grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="20" width="260" height="30" rx="6" class="teal"/>
<text x="170" y="39" text-anchor="middle" class="hdr tealtext">Functional Information</text>
<rect x="40" y="50" width="260" height="242" class="gray"/>
<text x="55" y="66" class="row rowtext">Person Number</text>
<text x="55" y="88" class="row rowtext">First Name</text>
<text x="55" y="110" class="row rowtext">Last Name</text>
<text x="55" y="132" class="row rowtext">Job Name</text>
<text x="55" y="154" class="row rowtext">Cost Center ID</text>
<text x="55" y="176" class="row rowtext">Annualized Salary</text>
<text x="55" y="198" class="row rowtext">Location Name</text>
<text x="55" y="220" class="row rowtext">Person Gender</text>
<text x="55" y="242" class="row rowtext">Hire Date</text>
<text x="55" y="264" class="row rowtext">Work Email</text>
<text x="55" y="286" class="row rowtext">Business Unit Name</text>

<rect x="40" y="310" width="260" height="30" rx="6" class="teal"/>
<text x="170" y="329" text-anchor="middle" class="hdr tealtext">Personal Information</text>
<rect x="40" y="340" width="260" height="22" class="gray"/>
<text x="55" y="356" class="row rowtext" font-weight="700">Person Date of Birth</text>

<rect x="40" y="380" width="260" height="30" rx="6" class="teal"/>
<text x="170" y="399" text-anchor="middle" class="hdr tealtext">Terminations report</text>
<rect x="40" y="410" width="260" height="88" class="gray"/>
<text x="55" y="426" class="row rowtext">Person Number</text>
<text x="55" y="448" class="row rowtext">Person Name</text>
<text x="55" y="470" class="row rowtext">Last day in service</text>
<text x="55" y="492" class="row rowtext">Job Name</text>

<rect x="40" y="516" width="260" height="30" rx="6" class="teal"/>
<text x="170" y="535" text-anchor="middle" class="hdr tealtext">Prior Month Functional Info</text>
<rect x="40" y="546" width="260" height="22" class="gray"/>
<text x="55" y="562" class="row rowtext" font-weight="700">Business Unit Name</text>

<rect x="600" y="20" width="260" height="30" rx="6" class="amber"/>
<text x="730" y="39" text-anchor="middle" class="hdr ambertext">Addition sheet</text>
<rect x="600" y="50" width="260" height="264" class="gray"/>
