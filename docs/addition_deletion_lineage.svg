<text x="615" y="88" class="row rowtext">First Name</text>
<text x="615" y="110" class="row rowtext">Last Name</text>
<text x="615" y="132" class="row rowtext">Designation</text>
<text x="615" y="154" class="row rowtext">Dept#</text>
<text x="615" y="176" class="row rowtext">CTC</text>
<text x="615" y="198" class="row rowtext">City</text>
<text x="615" y="220" class="row rowtext" font-weight="700">Date of Birth</text>
<text x="615" y="242" class="row rowtext">Gender</text>
<text x="615" y="264" class="row rowtext">DOJ</text>
<text x="615" y="286" class="row rowtext">Email Address</text>
<text x="615" y="308" class="row rowtext">Company Name</text>

<rect x="600" y="340" width="260" height="30" rx="6" class="amber"/>
<text x="730" y="359" text-anchor="middle" class="hdr ambertext">Deletion sheet</text>
<rect x="600" y="370" width="260" height="132" class="gray"/>
<text x="615" y="386" class="row rowtext">Emp Id</text>
<text x="615" y="408" class="row rowtext">Employee Name</text>
<text x="615" y="430" class="row rowtext">Last working date</text>
<text x="615" y="452" class="row rowtext">Job Name</text>
<text x="615" y="474" class="row rowtext" font-style="italic">Comments</text>
<text x="615" y="496" class="row rowtext" font-weight="700">Company Name</text>

<g stroke="#6B7A8F" stroke-width="1">
<line x1="300" y1="61" x2="600" y2="61" marker-end="url(#a2)"/>
<line x1="300" y1="83" x2="600" y2="83" marker-end="url(#a2)"/>
<line x1="300" y1="105" x2="600" y2="105" marker-end="url(#a2)"/>
<line x1="300" y1="127" x2="600" y2="127" marker-end="url(#a2)"/>
<line x1="300" y1="149" x2="600" y2="149" marker-end="url(#a2)"/>
<line x1="300" y1="171" x2="600" y2="171" marker-end="url(#a2)"/>
<line x1="300" y1="193" x2="600" y2="193" marker-end="url(#a2)"/>
<line x1="300" y1="215" x2="600" y2="237" marker-end="url(#a2)"/>
<line x1="300" y1="237" x2="600" y2="259" marker-end="url(#a2)"/>
<line x1="300" y1="259" x2="600" y2="281" marker-end="url(#a2)"/>
<line x1="300" y1="281" x2="600" y2="303" marker-end="url(#a2)"/>
</g>
<g stroke="#B45309" stroke-width="1.3">
<line x1="300" y1="351" x2="600" y2="215" marker-end="url(#a2amb)"/>
</g>
<text x="452" y="300" text-anchor="middle" class="lbl" fill="#B45309">joined on Person Number</text>
<g stroke="#6B7A8F" stroke-width="1">
<line x1="300" y1="421" x2="600" y2="381" marker-end="url(#a2)"/>
<line x1="300" y1="443" x2="600" y2="403" marker-end="url(#a2)"/>
<line x1="300" y1="465" x2="600" y2="425" marker-end="url(#a2)"/>
<line x1="300" y1="487" x2="600" y2="447" marker-end="url(#a2)"/>
</g>
<g stroke="#0F6E56" stroke-width="1.3">
<line x1="300" y1="557" x2="600" y2="491" marker-end="url(#a2grn)"/>
</g>
<text x="452" y="545" text-anchor="middle" class="lbl" fill="#0F6E56">backfilled, joined on Person Number</text>
</svg>
