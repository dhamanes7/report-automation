<svg width="680" height="550" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Local HR reporting automation architecture</title>
<desc>Task files enter a Streamlit app running fully on the local machine with no internet access. The app calls a processing engine that reads a separate client-specific config file, then writes result files back for download.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.75; }
  .teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .tealtext { fill: #085041; }
  .amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.75; }
  .ambertext { fill: #633806; }
  .green { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.75; }
  .greentext { fill: #27500A; }
</style>

<rect class="box" x="110" y="10" width="180" height="44" rx="8"/>
<text class="th" x="200" y="36" text-anchor="middle">Task 1 files</text>
<rect class="box" x="390" y="10" width="180" height="44" rx="8"/>
<text class="th" x="480" y="36" text-anchor="middle">Task 2 files</text>
<line x1="200" y1="54" x2="200" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="54" x2="480" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="green" x="50" y="80" width="560" height="350" rx="20"/>
<text class="th greentext" x="70" y="104">Client's local machine</text>
<text class="ts greentext" x="70" y="120">No internet access, ever</text>

<rect class="teal" x="130" y="150" width="400" height="56" rx="12"/>
<text class="th tealtext" x="330" y="172" text-anchor="middle">Streamlit app</text>
<text class="ts tealtext" x="330" y="190" text-anchor="middle">Runs on localhost, offline</text>

<line x1="260" y1="206" x2="260" y2="246" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="teal" x="130" y="246" width="260" height="56" rx="12"/>
<text class="th tealtext" x="260" y="268" text-anchor="middle">Processing engine</text>
<text class="ts tealtext" x="260" y="286" text-anchor="middle">pandas + openpyxl joins</text>

<rect class="amber" x="420" y="246" width="170" height="56" rx="12"/>
<text class="th ambertext" x="505" y="268" text-anchor="middle">Config</text>
<text class="ts ambertext" x="505" y="286" text-anchor="middle">Stays local only</text>

<line x1="420" y1="274" x2="392" y2="274" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="260" y1="302" x2="260" y2="460" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="box" x="180" y="460" width="220" height="56" rx="8"/>
<text class="th" x="290" y="482" text-anchor="middle">Result files</text>
<text class="ts" x="290" y="500" text-anchor="middle">Download from browser</text>
</svg>
