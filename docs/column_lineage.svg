<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Column-level lineage from Comp Roster and Distribution List into the Master sheet</title>
<style>
  text{font-family:Arial,Helvetica,sans-serif;}
  .hdr{font-size:12.5px;font-weight:700;}
  .row{font-size:11px;}
  .lbl{font-size:10px;font-style:italic;}
  .teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75;}
  .tealtext{fill:#085041;}
  .amber{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.75;}
  .ambertext{fill:#633806;}
  .gray{fill:#FAFAF8;stroke:#888780;stroke-width:0.75;}
  .rowtext{fill:#2C2C2A;}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B7A8F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arramb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrgrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="20" width="260" height="30" rx="6" class="teal"/>
<text x="170" y="39" text-anchor="middle" class="hdr tealtext">Comp Roster (source)</text>
<rect x="40" y="50" width="260" height="286" class="gray"/>
<text x="55" y="66" class="row rowtext">Person Number</text>
<text x="55" y="88" class="row rowtext">Display Name</text>
<text x="55" y="110" class="row rowtext">Grade Code</text>
<text x="55" y="132" class="row rowtext">Incentive Prog</text>
<text x="55" y="154" class="row rowtext">Incentive Target %</text>
<text x="55" y="176" class="row rowtext">Legislation</text>
<text x="55" y="198" class="row rowtext">Level 01 Organization Name</text>
<text x="55" y="220" class="row rowtext" font-weight="700">Department Name</text>
<text x="55" y="242" class="row rowtext">Department Set Name</text>
<text x="55" y="264" class="row rowtext">Annualized Salary</text>
<text x="55" y="286" class="row rowtext">Salary Currency</text>
<text x="55" y="308" class="row rowtext">Regular/Temporary</text>
<text x="55" y="330" class="row rowtext">Seniority Date</text>

<rect x="40" y="360" width="260" height="30" rx="6" class="teal"/>
<text x="170" y="379" text-anchor="middle" class="hdr tealtext">Distribution List (source)</text>
<rect x="40" y="390" width="260" height="66" class="gray"/>
<text x="55" y="406" class="row rowtext">Legislation (key)</text>
<text x="55" y="428" class="row rowtext">Region</text>
<text x="55" y="450" class="row rowtext">Distributee</text>

<rect x="600" y="20" width="260" height="30" rx="6" class="amber"/>
<text x="730" y="39" text-anchor="middle" class="hdr ambertext">Master (output) — 16 cols</text>
<rect x="600" y="50" width="260" height="352" class="gray"/>
<text x="615" y="66" class="row rowtext">Person Number</text>
<text x="615" y="88" class="row rowtext">Display Name</text>
<text x="615" y="110" class="row rowtext">Grade Code</text>
<text x="615" y="132" class="row rowtext">Incentive Prog</text>
<text x="615" y="154" class="row rowtext">Incentive Target %</text>
<text x="615" y="176" class="row rowtext">Country</text>
<text x="615" y="198" class="row rowtext">Level 01 Organization Name</text>
<text x="615" y="220" class="row rowtext" font-weight="700">Dept ID</text>
<text x="615" y="242" class="row rowtext" font-weight="700">Department Name</text>
<text x="615" y="264" class="row rowtext">Department Set Name</text>
<text x="615" y="286" class="row rowtext">Annualized Salary</text>
<text x="615" y="308" class="row rowtext">Currency Code</text>
<text x="615" y="330" class="row rowtext">Regular/Temporary</text>
<text x="615" y="352" class="row rowtext">Last Start</text>
<text x="615" y="374" class="row rowtext" font-weight="700">Region</text>
<text x="615" y="396" class="row rowtext" font-weight="700">Distributee</text>

<g stroke="#6B7A8F" stroke-width="1">
<line x1="300" y1="61" x2="600" y2="61" marker-end="url(#arr)"/>
<line x1="300" y1="83" x2="600" y2="83" marker-end="url(#arr)"/>
<line x1="300" y1="105" x2="600" y2="105" marker-end="url(#arr)"/>
<line x1="300" y1="127" x2="600" y2="127" marker-end="url(#arr)"/>
<line x1="300" y1="149" x2="600" y2="149" marker-end="url(#arr)"/>
<line x1="300" y1="171" x2="600" y2="171" marker-end="url(#arr)"/>
<line x1="300" y1="193" x2="600" y2="193" marker-end="url(#arr)"/>
</g>
<g stroke="#B45309" stroke-width="1.3">
<line x1="300" y1="215" x2="600" y2="215" marker-end="url(#arramb)"/>
<line x1="300" y1="215" x2="600" y2="237" marker-end="url(#arramb)"/>
</g>
<text x="440" y="230" text-anchor="middle" class="lbl" fill="#B45309">split on first space</text>
<g stroke="#6B7A8F" stroke-width="1">
<line x1="300" y1="237" x2="600" y2="259" marker-end="url(#arr)"/>
<line x1="300" y1="259" x2="600" y2="281" marker-end="url(#arr)"/>
<line x1="300" y1="281" x2="600" y2="303" marker-end="url(#arr)"/>
<line x1="300" y1="303" x2="600" y2="325" marker-end="url(#arr)"/>
<line x1="300" y1="325" x2="600" y2="347" marker-end="url(#arr)"/>
</g>
<g stroke="#0F6E56" stroke-width="1.3">
<line x1="300" y1="428" x2="600" y2="374" marker-end="url(#arrgrn)"/>
<line x1="300" y1="450" x2="600" y2="396" marker-end="url(#arrgrn)"/>
</g>
<g stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3">
<line x1="300" y1="406" x2="600" y2="171" marker-end="url(#arrgrn)"/>
</g>
<text x="450" y="290" text-anchor="middle" class="lbl" fill="#0F6E56">lookup key: Legislation = Country</text>
</svg>
